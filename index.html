
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMIC WORLD</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff9e7;
    color: #182b3b;
}

header {
    background: radial-gradient(
        circle, #ffae22 15%, transparent 16%
    ) 0 0 / 25px 25px, #ffda44;
    padding: 35px 20px;
    text-align: center;
    border-bottom: 5px solid #222;
}

header h1 {
    font-size: clamp(42px, 7vw, 80px);
    margin: 10px;
    color: #e52525;
    text-shadow: 3px 3px white, 5px 5px #222;
}

header p {
    font-size: 22px;
    font-weight: bold;
}

nav {
    background: #173b70;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

button {
    padding: 12px 18px;
    border: 2px solid #172c49;
    border-radius: 12px;
    background: #ffffff;
    color: #173b70;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ffdb42;
}

button.active {
    background: #ffdb42;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
    min-height: 450px;
}

h2 {
    color: #173b70;
    font-size: 30px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border: 3px solid #173b70;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 5px 5px #173b70;
    margin-bottom: 15px;
}

.card img {
    width: 100%;
    border-radius: 12px;
}

.hero {
    background: #dff5ff;
    text-align: center;
    padding: 35px;
}

.emoji {
    font-size: 65px;
    text-align: center;
    margin: 15px;
}

.tag {
    display: inline-block;
    background: #ffde4d;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
}

.feedback {
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
    background: #e2f4ff;
    font-weight: bold;
}

.correct {
    background: #d7f5d4;
    color: #176b28;
}

.incorrect {
    background: #fff0c2;
    color: #865800;
}

.answer {
    display: block;
    width: 100%;
    margin: 10px 0;
    text-align: left;
}

select, input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 2px solid #52708c;
    border-radius: 10px;
    font-size: 17px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #bccbd8;
    padding: 12px;
    text-align: center;
}

th {
    background: #173b70;
    color: white;
}

table select {
    min-width: 65px;
}

.selected {
    background: #ffdf68;
}

.bar {
    height: 25px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.fill {
    height: 100%;
    background: #28a765;
    transition: 0.4s;
}

footer {
    background: #173b70;
    color: white;
    text-align: center;
    padding: 25px;
}

@media print {
    nav, header, footer, button {
        display: none !important;
    }

    main {
        padding: 0;
    }

    .card {
        box-shadow: none;
    }
}
</style>
</head>

<body>

<header>
    <span class="tag">
        ИНКЛЮЗИВТІ БІЛІМ БЕРУ – 2026
    </span>

    <h1>COMIC WORLD</h1>

    <p>
        Комикс-ертегілердің түзете-дамыту мүмкіндіктері
    </p>
</header>

<nav id="navigation"></nav>

<main id="content"></main>

<footer>
    COMIC WORLD — авторлық түзете-дамытушы кешен
</footer>

<script>

const content = document.getElementById("content");

const sections = [
    "Басты бет",
    "Ертегілер",
    "COMIC DETECTIVE",
    "COMIC EMOTION",
    "COMIC SILENT",
    "LIVE COMIC",
    "COMIC MARKET",
    "COMIC AI STUDIO",
    "COMIC BOX",
    "COMIC PASSPORT"
];

const icons = [
    "🏠", "📚", "🔍", "😊", "💬",
    "🤝", "🛒", "💡", "🧩", "⭐"
];

function openSection(index) {
    document.getElementById("navigation").innerHTML =
        sections.map((name, i) => `
            <button
                class="${i === index ? 'active' : ''}"
                onclick="openSection(${i})">
                ${icons[i]} ${name}
            </button>
        `).join("");

    const functions = [
        home, library, detective, emotions,
        silent, liveComic, market, studio,
        comicBox, passport
    ];

    functions[index]();
    window.scrollTo(0, 0);
}

/* 1. БАСТЫ БЕТ */

function home() {
    content.innerHTML = `
        <div class="card hero">
            <div class="emoji">📚🌟🧩</div>

            <h2>Әр кадр – дамуға бір қадам!</h2>

            <h3>
                Көремін → Түсінемін → Реттеймін
                → Айтамын → Қолданамын
            </h3>

            <p>
                Ерекше білім беру қажеттіліктері бар
                балаларға арналған интерактивті
                түзете-дамытушы платформа.
            </p>

            <button onclick="openSection(1)">
                Ертегілер әлеміне кіру
            </button>
        </div>

        <div class="grid">
            ${sections.slice(1).map((name, i) => `
                <div class="card">
                    <div class="emoji">
                        ${icons[i + 1]}
                    </div>

                    <h3>${name}</h3>

                    <button onclick="openSection(${i + 1})">
                        Бастау
                    </button>
                </div>
            `).join("")}
        </div>
    `;
}

/* 2. ЕРТЕГІЛЕР КІТАПХАНАСЫ */

const stories = [
    {
        name: "Аңқау қасқыр",
        icon: "🐺",
        skill: "Логикалық ойлау",
        pages: [3, 6],
        text: "Қасқыр мен ешкі туралы оқиға. Бала оқиғаның ретін және кейіпкерлердің шешімін анықтайды."
    },
    {
        name: "Сиқырлы таяқша",
        icon: "🪄",
        skill: "Еңбекқорлық және дербестік",
        pages: [7, 10],
        text: "Мадияр сиқырлы таяқша табады. Ертегі еңбек пен отбасыға көмектесудің маңызын көрсетеді."
    },
    {
        name: "Ертегінің пайдасы",
        icon: "📖",
        skill: "Саналы таңдау",
        pages: [11, 13],
        text: "Арман кітап оқудың қызықты екенін түсінеді."
    },
    {
        name: "Аяз атаға хат",
        icon: "🎅",
        skill: "Өз қажеттілігін білдіру",
        pages: [14, 16],
        text: "Азиза Аяз атаға хат жазып, өзінің қалауын білдіреді."
    },
    {
        name: "Қоян мен түлкі",
        icon: "🐰🦊",
        skill: "Достық және бөлісу",
        pages: [17, 19],
        text: "Қоян мен түлкі достықтың, адалдықтың және кешірім сұраудың маңызын түсінеді."
    },
    {
        name: "Мейірімді сусар",
        icon: "🌳",
        skill: "Өзара көмек",
        pages: [20, 22],
        text: "Орман жануарлары сусарға көмектеседі."
    },
    {
        name: "Кішкентай күшік",
        icon: "🐶",
        skill: "Қамқорлық",
        pages: [23, 25],
        text: "Ертегі жануарларға қамқорлық жасау мен жауапкершілік туралы."
    },
    {
        name: "Нұрқожа батыр",
        icon: "🏆",
        skill: "Мақсатқа ұмтылу",
        pages: [26, 27],
        text: "Нұрқожа өзінің мүмкіндігіне сеніп, ел құрметіне ие болады."
    },
    {
        name: "Құдыретті күш",
        icon: "✨",
        skill: "Шешімді бағалау",
        pages: [28, 30],
        text: "Кейіпкерлердің шешімдері мен әрекеттерін талдауға арналған ертегі."
    },
    {
        name: "Раушан мен Бәйшешек",
        icon: "🌹🌷",
        skill: "Өзара құрмет",
        pages: [31, 32],
        text: "Гүлдер бір-бірін құрметтеудің маңызын түсінеді."
    }
];

function library() {
    content.innerHTML = `
        <h2>📚 COMIC BOOK</h2>
        <p>Авторлық 10 комикс-ертегі</p>

        <div class="grid">
            ${stories.map((story, i) => `
                <div class="card">
                    <div class="emoji">${story.icon}</div>
                    <h3>${story.name}</h3>
                    <p>${story.skill}</p>

                    <button onclick="readStory(${i})">
                        Ертегіні ашу
                    </button>
                </div>
            `).join("")}
        </div>
    `;
}

function readStory(i) {
    const s = stories[i];

    content.innerHTML = `
        <button onclick="library()">← Кітапхана</button>

        <div class="card hero">
            <div class="emoji">${s.icon}</div>

            <h2>${s.name}</h2>

            <p>${s.text}</p>

            <p>
                Дамытылатын дағды:
                <strong>${s.skill}</strong>
            </p>

            <a href="ertegiler.pdf#page=${s.pages[0]}"
               target="_blank">
                PDF жинағындағы ертегіні оқу
            </a>
        </div>

        <div class="card">
            <h3>Ертегі бойынша тапсырма</h3>

            <p>Кейіпкерлерді ата немесе көрсет.</p>

            <p>Оқиға қалай басталды?</p>

            <p>Кейіпкердің әрекетін сипатта.</p>

            <p>Ертегіден қандай дағды үйрендің?</p>

            <textarea
                rows="4"
                placeholder="Жауабыңды жаз...">
            </textarea>

            <button onclick="openSection(2)">
                Келесі тапсырма
            </button>
        </div>
    `;
}

/* 3. COMIC DETECTIVE */

let sequence = [];

const orderCards = [
    {
        id: 2,
        icon: "🏠",
        text: "Мадияр үйіне оралды."
    },
    {
        id: 3,
        icon: "😊",
        text: "Отбасы қуанды."
    },
    {
        id: 1,
        icon: "🪄",
        text: "Мадияр таяқша тапты."
    }
];

function detective() {
    sequence = [];

    content.innerHTML = `
        <h2>🔍 COMIC DETECTIVE</h2>

        <p>
            «Сиқырлы таяқша» ертегісіндегі
            оқиғаларды ретімен таңда.
        </p>

        <div class="grid">
            ${orderCards.map(c => `
                <button class="card"
                    onclick="selectOrder(${c.id}, this)">

                    <div class="emoji">${c.icon}</div>

                    <p>${c.text}</p>
                </button>
            `).join("")}
        </div>

        <div class="feedback" id="feedback">
            Таңдалған карточкалар: 0/3
        </div>

        <button onclick="detective()">
            Қайта бастау
        </button>
    `;
}

function selectOrder(id, element) {
    if (sequence.includes(id)) return;

    sequence.push(id);

    element.classList.add("selected");
    element.disabled = true;

    element.innerHTML += `
        <h3>${sequence.length}-орын</h3>
    `;

    if (sequence.length === 3) {
        showFeedback(
            sequence.join(",") === "1,2,3",
            "Жарайсың! Оқиғаны дұрыс реттедің."
        );
    } else {
        document.getElementById("feedback")
            .textContent =
            "Таңдалған карточкалар: "
            + sequence.length + "/3";
    }
}

/* ОРТАҚ БАҒАЛАУ */

function showFeedback(correct, message) {
    const feedback = document.getElementById("feedback");

    feedback.className =
        "feedback " +
        (correct ? "correct" : "incorrect");

    feedback.textContent = correct
        ? message || "Жарайсың! Дұрыс жауап!"
        : "Тағы ойланып көр. Сенің қолыңнан келеді!";
}

function quiz(title, icon, question, answers, correct) {
    content.innerHTML = `
        <h2>${title}</h2>

        <div class="card">
            <div class="emoji">${icon}</div>

            <h3>${question}</h3>

            ${answers.map((answer, i) => `
                <button class="answer"
                    onclick="showFeedback(${i === correct})">
                    ${answer}
                </button>
            `).join("")}

            <div class="feedback" id="feedback">
                Жауапты таңда.
            </div>
        </div>
    `;
}

/* 4. COMIC EMOTION */

const emotionQuestions = [
    ["😊", "Бала қандай көңіл күйде?",
        ["Қуанышты", "Мұңайған", "Ашулы"], 0],

    ["😢", "Бұл қандай эмоция?",
        ["Таңғалған", "Мұңайған", "Қуанышты"], 1],

    ["😠", "Кейіпкер қандай сезімде?",
        ["Сабырлы", "Қуанышты", "Ашулы"], 2],

    ["😮", "Бала қандай сезімде?",
        ["Таңғалған", "Ашулы", "Шаршаған"], 0],

    ["😴", "Бала өзін қалай сезінеді?",
        ["Қуанышты", "Шаршаған", "Ашулы"], 1],

    ["😨", "Кейіпкер қандай сезімде?",
        ["Сабырлы", "Қуанышты", "Қорыққан"], 2]
];

let emotionIndex = 0;

function emotions() {
    const q = emotionQuestions[emotionIndex];

    quiz(
        "😊 COMIC EMOTION",
        q[0], q[1], q[2], q[3]
    );

    content.innerHTML += `
        <button onclick="nextEmotion()">
            Келесі эмоция →
        </button>
    `;
}

function nextEmotion() {
    emotionIndex =
        (emotionIndex + 1) % emotionQuestions.length;

    emotions();
}

/* 5. COMIC SILENT */

const dialogues = [
    [
        "👧📚",
        "Азиза кітап алғысы келеді. Не айтады?",
        [
            "Маған кітап беріңізші.",
            "Мен кеттім.",
            "Кітап керек емес."
        ],
        0
    ],
    [
        "🐰✏️",
        "Қоян қарындашын таба алмады. Не айтады?",
        [
            "Сау болыңыз.",
            "Маған көмектесіңізші.",
            "Қайырлы түн."
        ],
        1
    ],
    [
        "🦊🐰",
        "Түлкі қоянды ренжітті. Не айта алады?",
        [
            "Сәлем!",
            "Мен кеттім.",
            "Кешірші."
        ],
        2
    ]
];

let dialogueIndex = 0;

function silent() {
    const q = dialogues[dialogueIndex];

    quiz(
        "💬 COMIC SILENT",
        q[0], q[1], q[2], q[3]
    );

    content.innerHTML += `
        <button onclick="nextDialogue()">
            Келесі диалог →
        </button>
    `;
}

function nextDialogue() {
    dialogueIndex =
        (dialogueIndex + 1) % dialogues.length;

    silent();
}

/* 6. LIVE COMIC */

const situations = [
    [
        "🧸",
        "Досың ойыншықпен ойнап отыр. Не істейсің?",
        [
            "Рұқсат сұраймын.",
            "Ойыншықты тартып аламын."
        ],
        0
    ],
    [
        "📖",
        "Тапсырманы түсінбедің. Не істейсің?",
        [
            "Мұғалімнен көмек сұраймын.",
            "Тапсырманы тастап кетемін."
        ],
        0
    ],
    [
        "🎒",
        "Сабақ аяқталды. Не істейсің?",
        [
            "Заттарды шашып кетемін.",
            "Оқу құралдарымды жинаймын."
        ],
        1
    ],
    [
        "🤝",
        "Досың көмек сұрады. Не істей аласың?",
        [
            "Мүмкіндігіме қарай көмектесемін.",
            "Оны мазақтаймын."
        ],
        0
    ]
];

let lifeIndex = 0;

function liveComic() {
    const q = situations[lifeIndex];

    quiz(
        "🤝 LIVE COMIC",
        q[0], q[1], q[2], q[3]
    );

    content.innerHTML += `
        <button onclick="nextLife()">
            Келесі жағдаят →
        </button>
    `;
}

function nextLife() {
    lifeIndex =
        (lifeIndex + 1) % situations.length;

    liveComic();
}

/* 7. COMIC MARKET */

const products = [
    ["📕", "Кітап", 3],
    ["✏️", "Қарындаш", 1],
    ["🍎", "Алма", 2],
    ["🧃", "Шырын", 2],
    ["🍞", "Нан", 1],
    ["🧸", "Ойыншық", 3]
];

let target = 0;
let selected = -1;
let payment = 0;

function market() {
    content.innerHTML = `
        <h2>🛒 COMIC MARKET</h2>

        <div class="card hero">
            <h3>Сатып алу тізімі</h3>
            <div class="emoji">
                ${products[target][0]}
            </div>

            <h3>${products[target][1]}</h3>
        </div>

        <div class="grid">
            ${products.map((p, i) => `
                <button
                    class="card ${selected === i
                        ? 'selected' : ''}"
                    onclick="chooseProduct(${i})">

                    <div class="emoji">${p[0]}</div>

                    <h3>${p[1]}</h3>

                    <p>${p[2]} ойын теңгесі</p>
                </button>
            `).join("")}
        </div>

        <div class="card">
            <h3>
                Маған ${selected === -1
                    ? "..."
                    : products[selected][1].toLowerCase()}
                беріңізші.
            </h3>

            <button onclick="pay(1)">🪙 +1</button>
            <button onclick="pay(2)">🪙 +2</button>
            <button onclick="pay(3)">🪙 +3</button>

            <h3>Төлем: ${payment}</h3>

            <button onclick="buy()">
                Сатып алу
            </button>

            <button onclick="payment=0; market()">
                Тазалау
            </button>

            <div class="feedback" id="feedback">
                Затты таңдап, төлем жаса.
            </div>

            <button onclick="nextProduct()">
                Келесі тапсырма
            </button>
        </div>
    `;
}

function chooseProduct(i) {
    selected = i;
    payment = 0;
    market();
}

function pay(value) {
    payment += value;
    market();
}

function buy() {
    showFeedback(
        selected === target &&
        payment === products[target][2],
        "Жарайсың! Сатып алуды дұрыс орындадың. Рақмет!"
    );
}

function nextProduct() {
    target = (target + 1) % products.length;
    selected = -1;
    payment = 0;

    market();
}

/* 8. COMIC AI STUDIO */

function studio() {
    content.innerHTML = `
        <h2>💡 COMIC AI STUDIO</h2>

        <div class="card">
            <h3>Өз комиксімді жасаймын</h3>

            <label>Кейіпкерді таңда:</label>

            <select id="character">
                <option>Қоян</option>
                <option>Түлкі</option>
                <option>Сусар</option>
                <option>Күшік</option>
                <option>Бала</option>
            </select>

            <label>Оқиға орны:</label>

            <select id="place">
                <option>Мектеп</option>
                <option>Үй</option>
                <option>Кітапхана</option>
                <option>Дүкен</option>
                <option>Орман</option>
            </select>

            <label>Қандай мәселе туындады?</label>

            <select id="problem">
                <option>Қарындашын таба алмады</option>
                <option>Тапсырманы түсінбеді</option>
                <option>Кітап таңдай алмады</option>
                <option>Досымен келісе алмады</option>
            </select>

            <label>Шешімі:</label>

            <select id="solution">
                <option>Мұғалімнен көмек сұрады</option>
                <option>Өз қажеттілігін білдірді</option>
                <option>Қайта түсіндіруді сұрады</option>
                <option>Досымен сөйлесті</option>
            </select>

            <button onclick="makeComic()">
                Комикс құрастыр
            </button>

            <div id="comicResult"></div>
        </div>
    `;
}

function makeComic() {
    const character =
        document.getElementById("character").value;

    const place =
        document.getElementById("place").value;

    const problem =
        document.getElementById("problem").value;

    const solution =
        document.getElementById("solution").value;

    const prompt =
        character + " туралы төрт кадрлық комикс жаса. " +
        "Оқиға орны: " + place + ". " +
        "Мәселе: " + problem + ". " +
        "Шешімі: " + solution + ". " +
        "Соңында кейіпкер мақсатына жетеді. " +
        "Қазақ тілінде қысқа диалогтер, " +
        "ірі суреттер және түсінікті әрекеттер болсын.";

    document.getElementById("comicResult").innerHTML = `
        <h2>Менің жаңа комиксім</h2>

        <div class="grid">
            <div class="card">
                <span class="tag">1-кадр</span>
                <div class="emoji">🏫</div>
                <p>${character}. Оқиға орны: ${place}.</p>
            </div>

            <div class="card">
                <span class="tag">2-кадр</span>
                <div class="emoji">❓</div>
                <p>${problem}</p>
            </div>

            <div class="card">
                <span class="tag">3-кадр</span>
                <div class="emoji">🤝</div>
                <p>${solution}</p>
            </div>

            <div class="card">
                <span class="tag">4-кадр</span>
                <div class="emoji">⭐</div>
                <p>Мақсатына жетті!</p>
            </div>
        </div>

        <h3>Жасанды интеллектке арналған промпт</h3>

        <textarea id="prompt" rows="6">
${prompt}</textarea>

        <button onclick="copyPrompt()">
            Промптты көшіру
        </button>

        <p>
            Промптты дефектолог тексеріп,
            ЖИ құралында пайдалана алады.
            Бұл бөлім ЖИ-ге тікелей қосылмаған.
        </p>
    `;
}

function copyPrompt() {
    const field = document.getElementById("prompt");
    field.select();

    try {
        const copied = document.execCommand("copy");

        alert(copied
            ? "Промпт көшірілді!"
            : "Мәтінді қолмен көшіріңіз."
        );
    } catch {
        alert("Мәтінді қолмен көшіріңіз.");
    }
}

/* 9. COMIC BOX */

const materials = [
    ["Оқиғаны ретте", "sequence.png", "🔢"],
    ["Диалогті толықтыр", "dialogue.png", "💬"],
    ["Комикс детективі", "detective.png", "🔍"],
    ["Көмек сұрау", "help.png", "🤝"],
    ["Дүкен ойыны", "market.png", "🛒"],
    ["Эмоциялық карточкалар", "emotions.png", "😊"],
    ["Танымдық карточкалар", "cards.png", "🧩"],
    ["Жетістік паспорты", "passport.png", "⭐"]
];

function comicBox() {
    content.innerHTML = `
        <h2>🧩 COMIC BOX</h2>

        <p>
            Дефектологке арналған баспа көрнекіліктері
        </p>

        <div class="grid">
            ${materials.map((m, i) => `
                <div class="card">
                    <div class="emoji">${m[2]}</div>

                    <h3>${m[0]}</h3>

                    <button onclick="printMaterial(${i})">
                        Көрнекілікті ашу
                    </button>
                </div>
            `).join("")}
        </div>
    `;
}

function printMaterial(i) {
    content.innerHTML = `
        <button onclick="comicBox()">
            ← Көрнекіліктер
        </button>

        <button onclick="window.print()">
            Басып шығару
        </button>

        <div class="card">
            <h2>${materials[i][0]}</h2>

            <img
                src="images/${materials[i][1]}"
                alt="${materials[i][0]}"
                onerror="this.style.display='none';
                document.getElementById('missing')
                    .style.display='block'">

            <p id="missing" style="display:none">
                Сурет файлын images бумасына орналастырыңыз.
            </p>
        </div>
    `;
}

/* 10. COMIC PASSPORT */

const skills = [
    "Кейіпкерді анықтау",
    "Оқиғаны реттеу",
    "Визуалды есте сақтау",
    "Эмоцияны ажырату",
    "Өз қажеттілігін білдіру",
    "Шешім қабылдау",
    "Әрекетті жоспарлау",
    "Дағдыны өмірде қолдану"
];

let scores = skills.map(() => ["", "", ""]);

try {
    const saved =
        JSON.parse(localStorage.getItem("comicScores"));

    if (Array.isArray(saved) &&
        saved.length === skills.length) {
        scores = saved;
    }
} catch (error) {}

function passport() {
    content.innerHTML = `
        <h2>⭐ COMIC PASSPORT</h2>

        <div class="card">
            <h3>Баланың жеке даму мониторингі</h3>

            <p>0 – әзірге орындамады.</p>
            <p>1 – педагогтің қолдауымен орындады.</p>
            <p>2 – өздігінен орындады.</p>

            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>Дағды</th>
                            <th>Бастапқы</th>
                            <th>Аралық</th>
                            <th>Қорытынды</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${skills.map((skill, i) => `
                            <tr>
                                <td>${skill}</td>

                                ${[0,1,2].map(j => `
                                    <td>
                                        <select
                                            onchange="saveScore(
                                                ${i},
                                                ${j},
                                                this.value
                                            )">

                                            ${["","0","1","2"]
                                                .map(v => `
                                                <option
                                                    value="${v}"
                                                    ${scores[i][j] === v
                                                        ? "selected"
                                                        : ""}>
                                                    ${v === ""
                                                        ? "—" : v}
                                                </option>
                                            `).join("")}

                                        </select>
                                    </td>
                                `).join("")}
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>

            <div id="results"></div>

            <button onclick="downloadCSV()">
                CSV сақтау
            </button>

            <button onclick="window.print()">
                Басып шығару
            </button>

            <button onclick="clearScores()">
                Нәтижелерді тазалау
            </button>

            <p>
                Баланың дербес мәліметтерін енгізбеңіз.
            </p>
        </div>
    `;

    updateResults();
}

function saveScore(i, j, value) {
    scores[i][j] = value;

    try {
        localStorage.setItem(
            "comicScores",
            JSON.stringify(scores)
        );
    } catch (error) {}

    updateResults();
}

function updateResults() {
    const stages = [
        "Бастапқы", "Аралық", "Қорытынды"
    ];

    document.getElementById("results").innerHTML =
        stages.map((stage, j) => {

            const values = scores
                .map(row => row[j])
                .filter(v => v !== "");

            const total = values.reduce(
                (sum, v) => sum + Number(v), 0
            );

            const maximum = values.length * 2;

            const percent = maximum
                ? Math.round(total / maximum * 100)
                : 0;

            return `
                <h3>${stage}</h3>

                <p>
                    ${values.length ? total : "—"}
                    / ${maximum} балл
                </p>

                <div class="bar">
                    <div class="fill"
                         style="width:${percent}%">
                    </div>
                </div>

                <p>
                    ${values.length
                        ? percent + "%"
                        : "Бағаланбаған"}
                    • ${values.length}/8 дағды
                </p>
            `;

        }).join("");
}

function clearScores() {
    if (confirm("Нәтижелерді тазалау керек пе?")) {
        scores = skills.map(() => ["", "", ""]);

        try {
            localStorage.removeItem("comicScores");
        } catch (error) {}

        passport();
    }
}

function downloadCSV() {
    const text =
        "\uFEFFДағды;Бастапқы;Аралық;Қорытынды\n" +
        skills.map((skill, i) =>
            [skill, ...scores[i]].join(";")
        ).join("\n");

    const blob = new Blob(
        [text],
        {type: "text/csv;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "COMIC_PASSPORT.csv";
    link.click();

    URL.revokeObjectURL(url);
}

openSection(0);

</script>
